[workspace]
members = ["crates/cf-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Damian Sire"]

# Lints centralizados: los crates los heredan con `[lints] workspace = true`.
# Institucionalizan lo que el código ya cumple (nada de unwrap/panic/dbg/print
# en dominio) para que no se degrade con el tiempo. -D warnings del CI los eleva
# a error.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Prohibido `#[allow]` suelto: va `#[expect(...)]`, que falla cuando el lint deja
# de dispararse. Sin esto se acumulan supresiones zombie (saqueo biomejs/biome).
allow_attributes = "deny"
# unwrap_used sigue PENDIENTE: allow-unwrap-in-tests no cubre los helpers fuera
# de #[test] en crates/cf-core/tests/, y tocar tests para que pase un gate esta
# prohibido. get_unwrap si entra (saqueos rerun_template y egui).
get_unwrap = "warn"
mem_forget = "warn"
clone_on_ref_ptr = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
similar = "2"
chrono = { version = "0.4", features = ["serde"] }
# Facade de logging: los caminos de LECTURA saltean entradas corruptas en vez de
# abortar, pero nada se traga en silencio.
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
